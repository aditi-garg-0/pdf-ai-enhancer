api:
  # Left unset on purpose: APIConfig.anthropic_api_key's default_factory reads
  # ANTHROPIC_API_KEY from your environment/.env, but ONLY if this key is
  # absent from the YAML entirely. A literal placeholder here (even
  # "your_key_here") overrides the env var every time and gets sent as the
  # actual bearer credential -- which is why every Claude API call was
  # failing with 401 Unauthorized. Set ANTHROPIC_API_KEY (and/or
  # GEMINI_API_KEY) in your .env file instead, and leave both out of
  # config.yaml.
  openai_api_key: ''
  # gemini_api_key: also left unset here for the same reason -- set
  # GEMINI_API_KEY in .env. Get a free key at aistudio.google.com.
  gemini_model: gemini-2.5-flash
  gemini_model_fast: gemini-2.5-flash-lite
  # "anthropic" tries Claude first, falls back to Gemini if no Claude key is
  # set or the Claude call fails. Set to "gemini" to prefer the free tier
  # even when a Claude key is also present.
  ai_provider_priority: anthropic
  claude_model: claude-opus-4-5
  claude_fast: claude-sonnet-4-20250514
  openai_model: gpt-4o
  max_concurrent_api_calls: 3
  api_retry_attempts: 5
  api_retry_min_wait: 1.0
  api_retry_max_wait: 60.0
  max_tokens_correction: 4096
  max_tokens_analysis: 2048
  max_tokens_summary: 1024

extraction:
  render_dpi: 400          # bumped from 300: higher-res source blocks give the
                            # SR pass a better starting point for "very high HD"
  render_dpi_ocr: 400
  render_colorspace: RGB
  text_density_threshold: 0.0
  image_area_threshold: 0.01
  diagram_aspect_ratio_min: 0.05
  text_extract_mode: full
  extract_fonts: true
  table_extraction_method: all
  camelot_flavor: lattice

enhancement:
  enable_denoising: true
  denoise_strength: 10.0
  enable_clahe: true
  clahe_clip_limit: 3.0
  clahe_grid_size: 8
  enable_sharpening: true
  sharpen_sigma: 1.5
  sharpen_amount: 1.5

  # Super-resolution
  enable_super_resolution: true
  # Switched from RealESRGAN_x4plus_anime: that model is trained on anime
  # illustration style, which conventionally includes cel-shading/drop-shadow
  # as part of the art style -- run on a scanned schematic it hallucinates
  # that same shading onto every line/character (the "grey shadow around
  # everything" you were seeing). RealESRGAN_x4plus is a general-purpose
  # model with no such stylization bias.
  sr_model: RealESRGAN_x4plus
  sr_outscale: 4.0
  sr_tile: 512
  sr_tile_pad: 10
  sr_half: true
  sr_gpu_id: 0

  # Selective SR — tile-grid based: only GAN-upscale tiles that actually
  # contain ink (thin lines only trigger the tiles they pass through, not
  # a bounding box spanning the whole page). Blank tiles get a cheap
  # bicubic resize instead.
  selective_sr: true
  selective_sr_tile_px: 0        # 0 = match sr_tile above
  selective_sr_tile_density: 0.004

  # Vectorization / line-art
  enable_vectorization: true
  vectorize_threshold: 128
  vectorize_min_area: 50
  vector_raster_scale: 4
  max_vectorize_dim_px: 2500   # skip vectorization on blocks bigger than this
                                # (i.e. whole scanned pages, not logos/diagrams)
  # If using potrace, ensure the binary is installed on the system

  # Face restoration
  enable_face_restoration: true
  face_model: GFPGANv1.4

  # Output format / compression — all lossless/near-lossless now.
  # Diagrams are always written as full-color, non-quantized PNG
  # (see image_enhancer.py _maybe_downscale_and_compress) — pngquant
  # quantization has been removed since it was reintroducing grey/dithered
  # pixels on top of the whitened backgrounds.
  output_format: PNG
  jpeg_quality: 97
  png_compress: 1
  prefer_webp: false
  webp_quality: 97

  # Output resolution ceiling — raised so 4x super-resolved diagrams are not
  # shrunk back down before being written into the final PDF. A 900x1200
  # source block at 4x SR is ~17MP; the old 6MP/3500px ceiling silently
  # discarded most of that.
  max_image_pixels: 60000000
  max_image_width: 10000
  max_image_height: 10000

  # Global auto-contrast / black-point stretch -- THIS is what fixes
  # "washed out"/faded-ink pages. Whitening (below) only ever lightens
  # background pixels; it has no effect on ink that's already faint
  # (e.g. a typewriter-era or degraded scan where "black" text sits at
  # L~140-180, not near 0) -- nothing else in the pipeline moves a dark
  # pixel darker. This remaps the page's actual dark/light extremes onto
  # the full 0-255 range before CLAHE/sharpening run. See the docstring
  # on ImageEnhancer._auto_contrast_stretch for details.
  enable_auto_contrast: true
  auto_contrast_black_percentile: 1.0
  auto_contrast_white_percentile: 99.0
  auto_contrast_min_range: 20.0
  # NEW: the linear stretch above only forces the darkest 1% of pixels to
  # true black -- it does NOT darken the much larger population of
  # anti-aliased/partial-coverage ink pixels (thin strokes on an old/
  # typewriter-era scan), because a linear remap preserves each pixel's
  # relative position in the range. That's why black_point can measure as
  # "fixed" (near 0) while the page still visually reads as washed out --
  # most of what your eye reads as "the text" isn't in that darkest 1%.
  # This applies out=255*(in/255)**gamma AFTER the linear stretch, which
  # pushes midtones darker while leaving true white/true black fixed.
  # 1.0 = off. Start at 1.8; raise toward 2.2-2.5 if text is still light,
  # lower toward 1.4 if thin diagonal/curved lines start looking jagged.
  auto_contrast_gamma: 1.8

  # Diagram background whitening (grey-boundary cleanup). See the docstring
  # on ImageEnhancer._whiten_diagram_background for why raising block_size
  # does NOT help and why whiten_c is the correct knob to widen the net.
  whiten_block_size: 15
  whiten_c: 9.0
  whiten_c_resolution_scale: 1.0
  # adaptiveThreshold only tests "is this pixel brighter than its local
  # neighborhood average, minus C" -- a RELATIVE test. It has no sense of
  # absolute brightness, so a large solid-black region (letter interiors,
  # a stamp's ink fill, a logo) also passes that test, since its local
  # mean is already ~equal to its own dark value. Without this floor,
  # every filled glyph gets hollowed into an outline: interiors get
  # whited out as "background" while only the anti-aliased edge ring
  # (where the neighborhood mean gets pulled up by adjacent paper) stays
  # dark. This requires the local neighborhood to ALSO be near
  # paper-white (0-255 scale) before a pixel can be whitened.
  whiten_min_local_brightness: 140.0
  debug_whitening: false

  # Logo / color preservation and final tuning
  remove_paper_texture: true
  saturation_boost: 1.05
  brightness_boost: 1.02
  final_unsharp: true
  final_unsharp_sigma: 1.0
  final_unsharp_amount: 0.5

ocr:
  engine_priority:
  - paddleocr
  - tesseract
  - easyocr
  tesseract_lang: eng
  tesseract_oem: 3
  tesseract_psm: 6
  tesseract_dpi: 300
  easyocr_langs:
  - en
  easyocr_gpu: true
  easyocr_detail: 1
  paddle_lang: en
  paddle_use_gpu: true
  paddle_use_angle_classifier: true
  min_confidence: 0.6
  ensemble_strategy: confidence
  enable_ai_correction: true
  enable_spell_correction: true
  enable_grammar_fix: true
  enable_unicode_fix: true

diagram:
  enable_ai_analysis: true
  enable_reconstruction: false
  enable_vectorization: true
  embed_as_vector: true
  min_diagram_size_px: 100
  diagram_types:
  - flowchart
  - schematic
  - graph
  - table
  - formula
  - equation
  - map
  - photo
  - logo

pipeline:
  pages: null
  skip_text_pages: false
  skip_image_pages: false
  workers: 4
  batch_size: 5
  output_dpi: 400
  output_suffix: _enhanced
  embed_searchable_text: true
  compress_output: true
  optimize_output: true
  enable_checkpoint: true
  checkpoint_db: /Users/aditigarg/pdf_ai_enhancer/.cache/pipeline_state.db
  compute_ssim: true
  compute_psnr: true
  save_report: true